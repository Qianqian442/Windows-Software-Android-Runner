name: Build Android Runner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then ./gradlew assembleDebug; else echo "Gradle wrapper not yet committed"; exit 1; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Software-Android-Runner-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
